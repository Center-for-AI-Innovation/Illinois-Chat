[project]
name = "ai-ta-backend"
version = "0.0.0"
description = "Illinois Chat Flask API and RabbitMQ ingest worker"
# One interpreter line, the one in .python-version, CI and both images: the lock then holds a
# single resolution, and that resolution is the one the tests run against.
requires-python = "==3.12.*"
dependencies = [
  # Shared by the API process (which imports rabbitmq.rmqueue / ingest_canvas) and the worker.
  "python-dotenv==1.0.1",
  "Flask==3.1.0",
  "Flask-SQLAlchemy==3.0.0",
  "SQLAlchemy==2.0.38",
  "psycopg2-binary==2.9.13",
  "pika==1.3.2",
  "cryptography==50.0.2",
  "boto3==1.36.20",
  "qdrant-client==1.13.2",
  "openai==1.63.0",
  "tiktoken==0.9.0",
  "aiohttp==3.14.5",
  "requests",
  "langchain==0.3.18",
  "langchain-community==0.3.16",
  "langchain-openai==0.3.5",
  "pydantic==2.10.6",
  "posthog==3.13.0",
  "sentry-sdk==2.21.0",
  "canvasapi==3.2.0",
  "yt-dlp==2024.7.16",
  "brotli>=1.2.1",  # CVE-2026-111497; yt-dlp pulls brotli in unpinned
  "beautifulsoup4==4.12.2",
  # File parsing used by retrieval_service (chat uploads) and ingest.py.
  "PyMuPDF==1.23.6",
  "pdfplumber==0.11.0",
  "pytesseract==0.3.10",
  "Pillow==12.3.0",
  "python-docx==0.8.11",
  "python-pptx==0.6.23",  # not via unstructured[pptx]: that extra requires >=1.0.1
  "openpyxl==3.1.2",
  "pysrt==1.1.2",
  "pandas>=2.2,<3",
  "numpy>=1.26.4,<2",  # what the 3.10 images ran; numpy 2 is a change of its own
  "retry==0.9.2",
  # Loaders behind the chat-upload fallbacks in retrieval_service (Docx2txtLoader,
  # UnstructuredExcelLoader, UnstructuredPowerPointLoader) and behind ingest.py.
  "unstructured[xlsx]==0.18.9",
  "networkx==3.2.1",
  "docx2txt==0.8",
]

[project.optional-dependencies]
# Flask API only (Self-Hosted-Dockerfile installs --extra api).
api = [
  "gunicorn==23.0.0",
  "flask-cors==5.0.0",
  "Flask-Injector==0.15.0",
  "injector",
  "flask-executor==1.0.0",
  "langgraph==0.2.69",
  "langchain-neo4j==0.4.0",
  "nomic==3.4.1",
  "ollama==0.4.7",
  "supabase==2.13.0",
  "minio==7.2.15",
  "redis[hiredis]==5.2.1",
  "XlsxWriter==3.2.2",
  # Imported by langchain's OpenAIEmbeddings, not by our code: with tiktoken_enabled=False
  # (every embedding model except text-embedding-ada-002) it tokenizes with AutoTokenizer.
  "transformers==4.45.2",
  "tenacity",
  "pytz",
  "python-dateutil",
  "typing_extensions",
]
# Ingest worker only (ai_ta_backend/rabbitmq/Dockerfile installs --extra worker).
worker = [
  "xlrd>=2.0.1",
  "msoffcrypto-tool==5.2.0",
  "nltk",
  "pydub==0.25.1",
  "GitPython==3.1.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# Nothing imports ai_ta_backend as an installed distribution; the Flask CLI, gunicorn,
# the worker script path and pytest's pythonpath all resolve it from the working directory.
package = false
# Pins the API requirements file carried for packages we never import directly. They stay
# as constraints so the migration does not move them; raise them like any other pin.
constraint-dependencies = [
  "protobuf==5.29.3",
  "click==8.1.8",
  "typing-extensions==4.12.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
