name: Build and Push Crawlee Images on Tag

on:
  push:
    tags:
      - '*'

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: uiuc-chat-crawlee

jobs:
  build-and-push-dev:
    name: Build and Push DEV Crawlee Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set DEV image tag
        id: set-tag
        run: |
          GIT_TAG=${GITHUB_REF#refs/tags/}
          DEV_IMAGE_TAG="dev-${GIT_TAG}"
          echo "DEV_IMAGE_TAG=${DEV_IMAGE_TAG}" >> $GITHUB_ENV
          echo "dev_image_tag=${DEV_IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Build, tag, and push DEV Crawlee image to Amazon ECR
        id: build-dev-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          echo "Building DEV Crawlee image with tag: $DEV_IMAGE_TAG"

          docker build \
            --build-arg S3_BUCKET_NAME=${{ vars.S3_BUCKET_NAME }} \
            --build-arg AWS_REGION=${{ vars.CRAWLEE_AWS_REGION }} \
            --build-arg AWS_KEY=${{ secrets.CRAWLEE_AWS_KEY }} \
            --build-arg AWS_SECRET=${{ secrets.CRAWLEE_AWS_SECRET }} \
            --build-arg MINIO_ENDPOINT=${{ vars.MINIO_ENDPOINT }} \
            --build-arg INGEST_URL=${{ vars.INGEST_URL }} \
            --build-arg NO_CRAWL=${{ vars.NO_CRAWL }} \
            --build-arg PORT=${{ vars.CRAWLEE_PORT }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$DEV_IMAGE_TAG .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$DEV_IMAGE_TAG

      - name: Output DEV image tag
        run: |
          echo "DEV Crawlee image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.DEV_IMAGE_TAG }}"


  build-and-push-prod:
    name: Build and Push PROD Crawlee Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set PROD image tag
        id: set-tag
        run: |
          GIT_TAG=${GITHUB_REF#refs/tags/}
          PROD_IMAGE_TAG="prod-${GIT_TAG}"
          echo "PROD_IMAGE_TAG=${PROD_IMAGE_TAG}" >> $GITHUB_ENV
          echo "prod_image_tag=${PROD_IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Build, tag, and push PROD Crawlee image to Amazon ECR
        id: build-prod-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          echo "Building PROD Crawlee image with tag: $PROD_IMAGE_TAG"

          docker build \
            --build-arg S3_BUCKET_NAME=${{ vars.S3_BUCKET_NAME }} \
            --build-arg AWS_REGION=${{ vars.CRAWLEE_AWS_REGION }} \
            --build-arg AWS_KEY=${{ secrets.PROD_CRAWLEE_AWS_KEY }} \
            --build-arg AWS_SECRET=${{ secrets.PROD_CRAWLEE_AWS_SECRET }} \
            --build-arg MINIO_ENDPOINT=${{ vars.MINIO_ENDPOINT }} \
            --build-arg INGEST_URL=${{ vars.PROD_INGEST_URL }} \
            --build-arg NO_CRAWL=${{ vars.NO_CRAWL }} \
            --build-arg PORT=${{ vars.CRAWLEE_PORT }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$PROD_IMAGE_TAG .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$PROD_IMAGE_TAG

      - name: Output PROD image tag
        run: |
          echo "PROD Crawlee image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.PROD_IMAGE_TAG }}"
