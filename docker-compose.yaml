services:
  traefik:
    image: traefik:v3.6
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      - "--entrypoints.web.address=:80"
      - "--log.level=DEBUG" # Set log level to DEBUG
      - "--accesslog=true" # Enable access logs
    ports:
      - "80:80"
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  whoami:
    image: traefik/whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.docker.localhost`)"
      - "traefik.http.routers.whoami.entrypoints=web"
  redis:
    image: redis:7.2
    restart: unless-stopped
    command: redis-server --requirepass ${INGEST_REDIS_PASSWORD}
#    ports:
#       - 6379:6379
    networks:
      - uiuc-chat-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s # Optional: Time to wait before starting health checks

  qdrant:
    image: qdrant/qdrant:v1.9.0
    restart: unless-stopped
    # environment:
    #   - QDRANT_API_KEY=${QDRANT_API_KEY}
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - qdrant-data:/qdrant/storage
      - ./qdrant_config.yaml:/qdrant/config/production.yaml # Mount the config file directly as a volume
    networks:
      - uiuc-chat-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s # Give Qdrant time to start before health checks begin

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    restart: unless-stopped
    # Customize env vars in .env file
    env_file:
      - .env.prod
    command: server /data --console-address ":9001" --address ":9000"
    ports:
      - "9000:9000" # MinIO API port
      - "9001:9001" # MinIO Console port (note: Console deprecated Q4 2024)
    networks:
      - uiuc-chat-network
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.minio.service=minio"
      - "traefik.http.routers.minio.rule=Host(`minio.docker.localhost`)"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio.entrypoints=web"

      - "traefik.http.routers.minioconsole.service=minioconsole"
      - "traefik.http.routers.minioconsole.rule=Host(`minioconsole.docker.localhost`)"
      - "traefik.http.services.minioconsole.loadbalancer.server.port=9001"
      - "traefik.http.routers.minioconsole.entrypoints=web"
#  crawlee:
#    build: ./ic_crawlee
#    container_name: ic_crawlee
#    networks:
#      - uiuc-chat-network
#    volumes:
#      - ./data:/data
#    ports:
#      - "3345:3000"
#    env_file:
#      - .env
#    environment:
#      - INGEST_URL=http://flask-app:8001/ingest
#    depends_on:
#      - redis

  postgres-illinois-chat:
    image: postgres
    restart: unless-stopped
    networks:
      - uiuc-chat-network
    volumes:
      - postgres-illinois-chat:/var/lib/postgres/data
    env_file:
      - .env.prod
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DATABASE: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-keycloak:
    image: postgres
    restart: unless-stopped
    networks:
      - uiuc-chat-network
    volumes:
      - postgres-keycloak:/var/lib/postgres/data
    env_file:
      - .env.prod
    environment:
      POSTGRES_DATABASE: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    env_file:
      - .env.prod
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "5672" ]
      interval: 3s
      timeout: 10s
      retries: 3
    networks:
      - uiuc-chat-network
    volumes:
      - rabbitmq:/var/lib/rabbitmq

  keycloak:
    platform: linux/amd64  # M chip
    image: quay.io/keycloak/keycloak:26.1
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "8080:8080"
    networks:
      - uiuc-chat-network
    depends_on:
      - postgres-keycloak
    command:
      - start-dev
      - --http-enabled=true
      - --hostname=localhost
      - --hostname-strict=false
      - --db=postgres
      - --db-url=jdbc:postgresql://postgres-keycloak:5432/postgres
      - --db-username=postgres
      - --db-password=password
      - --import-realm
    environment:
      - KC_METRICS_ENABLED=true
      - KC_HEALTH_ENABLED=true
    volumes:
      - ./keycloak-theme:/opt/keycloak/themes/keywind
      - ./keycloak/realms/realm-export.json:/opt/keycloak/data/import/realm-export.json
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s # Give Keycloak time to start up before checking
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.service=keycloak"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.docker.localhost`)"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
      - "traefik.http.routers.keycloak.entrypoints=web"

  backend:
    platform: linux/arm64/v8
    build:
      context: ./uiuc-chat-backend
      dockerfile: Self-Hosted-Dockerfile
    restart: unless-stopped
    networks:
      - uiuc-chat-network
    depends_on:
      - rabbitmq
      - postgres-illinois-chat
    environment:
      RABBITMQ_URL: 'amqp://guest:guest@rabbitmq:5672'
      POSTGRES_ENDPOINT: postgres-illinois-chat
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: postgres
      POSTGRES_USERNAME: postgres
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION_NAME: uiuc-chat
      MINIO_URL: http://minio:10000
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      S3_BUCKET_NAME: uiuc-chat
    env_file:
      - .env.prod

  frontend:
    build:
      context: ./uiuc-chat-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_KEYCLOAK_REALM: illinois_chat_realm
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: illinois_chat
        NEXT_PUBLIC_USE_ILLINOIS_CHAT_CONFIG: True
#        NEXT_PUBLIC_ILLINOIS_CHAT_BANNER_CONTENT: ""
#        NEXT_PUBLIC_POSTHOG_KEY: ""
#        NEXT_PUBLIC_POSTHOG_HOST: ""
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - uiuc-chat-network
    env_file:
      - .env.prod
    environment:
      # TODO: For some reason nextjs requires ENV variables to be defined in docker compose as they are not picked up
      # TODO: from .env.prod specified above in env_file. Need to investigate this further.
      # Server-side Keycloak URL (for container-to-container communication)
      KEYCLOAK_URL: "http://keycloak:8080/"
      # NEXT_PUBLIC_KEYCLOAK_URL is already set in .env.prod for browser-side code
      # PostgreSQL connection settings (required for server-side database access)
      POSTGRES_ENDPOINT: postgres-illinois-chat
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Keycloak PostgreSQL connection settings
      KEYCLOAK_DB_ENDPOINT: postgres-keycloak
      KEYCLOAK_DB_PORT: 5432
      KEYCLOAK_DB_DATABASE: postgres
      KEYCLOAK_DB_USERNAME: postgres
      KEYCLOAK_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # MinIO configuration
      LOCAL_MINIO: true
      AWS_REGION: us-east-1
      AWS_KEY: minioadmin
      AWS_SECRET: minioadmin
      S3_BUCKET_NAME: uiuc-chat
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      # Vyriad MinIO configuration
      VYRIAD_MINIO_ENDPOINT: http://minio:9000
      VYRIAD_MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      VYRIAD_MINIO_REGION: us-east-1
      VYRIAD_MINIO_KEY: minioadmin
      VYRIAD_MINIO_SECRET: minioadmin
      # qdrant
      QDRANT_API_KEY: your-strong-key-here
      QDRANT_COLLECTION_NAME: uiuc-chat
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - keycloak
      - postgres-illinois-chat

  worker:
    build:
      context: ./uiuc-chat-backend/ai_ta_backend/rabbitmq
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - uiuc-chat-network
    env_file:
      - .env.prod
    environment:
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672"
      POSTGRES_HOST: postgres-illinois-chat
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION_NAME: uiuc-chat
      S3_BUCKET_NAME: uiuc-chat
    depends_on:
      - rabbitmq
      - postgres-illinois-chat
      - qdrant
      - minio

# declare the network resource
# this will allow you to use service discovery and address a container by its name from within the network
networks:
  uiuc-chat-network:
    driver: bridge

volumes:
  redis-data: {}
  qdrant-data: {}
  minio-data: {}
  postgres-illinois-chat: {}
  postgres-keycloak: {}
  rabbitmq: {}
