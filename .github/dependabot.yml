# Dependabot version updates. Python projects are managed with uv, so the
# `uv` ecosystem bumps pyproject.toml pins and regenerates uv.lock.
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/apps/backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
