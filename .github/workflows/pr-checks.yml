name: PR Checks

on:
  pull_request:
    branches:
      - monorepo
      - illinois-chat
      - main

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # trunk-action posts lint results as check-run annotations

jobs:
  trunk-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Lint only what this PR changed, by diffing against the PR base sha.
      # check-mode: all would point trunk at the whole accumulated tree
      # (~1436 files, ~895 pre-existing issues, since main was never linted)
      # and attribute every one of them to whichever PR happened to be open.
      #
      # fetch-depth: 0 above is required -- trunk needs the base commit
      # present locally to compute the diff.
      #
      # Non-frontend paths (apps/backend, infra, docs, overrides, etc.)
      # are ignored repo-wide in .trunk/trunk.yaml, so this stays
      # diff-only while only ever surfacing frontend issues. Drop that
      # ignore rule once those trees are ready to be linted too.
      - name: Trunk Check (PR diff only)
        uses: trunk-io/trunk-action@v1
        with:
          check-mode: pull_request

      # Backend tests placeholder
      - name: Backend tests
        run: |
          echo "TODO: add backend tests (e.g., pytest) here"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      # The branch that added Sim shipped a `next build` failure — a free
      # variable left behind by a deleted block — because nothing in CI
      # typechecks: vitest does not, and trunk runs with check-mode: none.
      #
      # Scoped to shipped source via tsconfig.build.json (the same config
      # `next build` type-checks against). The test files carry pre-existing
      # errors that predate this workflow; gating on them would fail every PR
      # regardless of its contents, the same trap the trunk comment above
      # describes. `npm run typecheck:all` covers tests locally.
      - name: Frontend typecheck
        working-directory: apps/frontend
        run: npm run typecheck

      - name: Frontend tests
        working-directory: apps/frontend
        run: npm run test:coverage:check

  # The crawler is its own package with its own lock file, so it has its own job and
  # does not wait for the lint and frontend steps above.
  crawlee-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      # Node 22, the version of the crawler image (apps/crawlee/Dockerfile).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/crawlee/package-lock.json

      # --ignore-scripts skips the postinstall script, which downloads the
      # Playwright browsers. The type check and the unit tests start no browser.
      - name: Install crawler dependencies
        working-directory: apps/crawlee
        run: npm ci --ignore-scripts

      # `npm run build` is tsc: it type-checks the shipped source. The test
      # files are not part of it (tsconfig.json excludes them); tsx runs them.
      - name: Crawler typecheck
        working-directory: apps/crawlee
        run: npm run build

      - name: Crawler tests
        working-directory: apps/crawlee
        run: npm test
