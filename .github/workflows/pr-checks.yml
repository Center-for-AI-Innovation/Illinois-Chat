name: PR Checks

on:
  pull_request:
    branches:
      - monorepo
      - illinois-chat
      - main

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # trunk-action posts lint results as check-run annotations

jobs:
  trunk-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Lint only what this PR changed, by diffing against the PR base sha.
      # check-mode: all would point trunk at the whole accumulated tree
      # (~1436 files, ~895 pre-existing issues, since main was never linted)
      # and attribute every one of them to whichever PR happened to be open.
      #
      # fetch-depth: 0 above is required -- trunk needs the base commit
      # present locally to compute the diff.
      #
      # Non-frontend paths (apps/backend, infra, docs, overrides, etc.)
      # are ignored repo-wide in .trunk/trunk.yaml, so this stays
      # diff-only while only ever surfacing frontend issues. Drop that
      # ignore rule once those trees are ready to be linted too.
      - name: Trunk Check (PR diff only)
        uses: trunk-io/trunk-action@v1
        with:
          check-mode: pull_request

      # --frozen fails the job if pyproject.toml changed without re-locking.
      # --all-extras: the worker tests import ai_ta_backend.rabbitmq modules.
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: apps/backend/uv.lock

      - name: Install backend dependencies
        working-directory: apps/backend
        run: uv sync --frozen --all-extras

      - name: Backend tests
        working-directory: apps/backend
        run: uv run --frozen pytest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      # The branch that added Sim shipped a `next build` failure — a free
      # variable left behind by a deleted block — because nothing in CI
      # typechecks: vitest does not, and trunk runs with check-mode: none.
      #
      # Scoped to shipped source via tsconfig.build.json (the same config
      # `next build` type-checks against). The test files carry pre-existing
      # errors that predate this workflow; gating on them would fail every PR
      # regardless of its contents, the same trap the trunk comment above
      # describes. `npm run typecheck:all` covers tests locally.
      - name: Frontend typecheck
        working-directory: apps/frontend
        run: npm run typecheck

      - name: Frontend tests
        working-directory: apps/frontend
        run: npm run test:coverage:check

  # Only PRs that touch the backend need to prove the images still build.
  backend-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - '.github/workflows/pr-checks.yml'

  # Build (no push) both backend images so a broken Dockerfile fails the PR
  # instead of the push-to-main deploy. Same contexts as illinois-chat-dev.yml.
  # Runs beside trunk-and-tests, so a frontend failure never hides a broken
  # Dockerfile, and only when the backend changed. Layers are cached in the
  # GitHub Actions cache per image, so an unchanged apt/uv layer is not rebuilt.
  backend-images:
    needs: backend-changes
    if: needs.backend-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Self-Hosted-Dockerfile
          - name: worker
            dockerfile: ai_ta_backend/rabbitmq/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/${{ matrix.dockerfile }}
          push: false
          tags: ic-${{ matrix.name }}:pr
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
