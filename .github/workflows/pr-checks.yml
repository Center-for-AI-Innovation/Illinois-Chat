name: PR Checks

on:
  pull_request:
    branches:
      - monorepo
      - illinois-chat
      - main

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # trunk-action posts lint results as check-run annotations

jobs:
  trunk-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Lint only what this PR changed, by diffing against the PR base sha.
      # check-mode: all would point trunk at the whole accumulated tree
      # (~1436 files, ~895 pre-existing issues, since main was never linted)
      # and attribute every one of them to whichever PR happened to be open.
      #
      # fetch-depth: 0 above is required -- trunk needs the base commit
      # present locally to compute the diff.
      #
      # Non-frontend paths (apps/backend, infra, docs, overrides, etc.)
      # are ignored repo-wide in .trunk/trunk.yaml, so this stays
      # diff-only while only ever surfacing frontend issues. Drop that
      # ignore rule once those trees are ready to be linted too.
      - name: Trunk Check (PR diff only)
        uses: trunk-io/trunk-action@v1
        with:
          check-mode: pull_request

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      # The branch that added Sim shipped a `next build` failure — a free
      # variable left behind by a deleted block — because nothing in CI
      # typechecks: vitest does not, and trunk runs with check-mode: none.
      #
      # Scoped to shipped source via tsconfig.build.json (the same config
      # `next build` type-checks against). The test files carry pre-existing
      # errors that predate this workflow; gating on them would fail every PR
      # regardless of its contents, the same trap the trunk comment above
      # describes. `npm run typecheck:all` covers tests locally.
      - name: Frontend typecheck
        working-directory: apps/frontend
        run: npm run typecheck

      - name: Frontend tests
        working-directory: apps/frontend
        run: npm run test:coverage:check

  # The crawler is its own package with its own lock file, so it has its own job and
  # does not wait for the lint and frontend steps above.
  crawlee-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      # Node 22, the version of the crawler image (apps/crawlee/Dockerfile).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/crawlee/package-lock.json

      # --ignore-scripts skips the postinstall script, which downloads the
      # Playwright browsers. The type check and the unit tests start no browser.
      - name: Install crawler dependencies
        working-directory: apps/crawlee
        run: npm ci --ignore-scripts

      # `npm run build` is tsc: it type-checks the shipped source. The test
      # files are not part of it (tsconfig.json excludes them); tsx runs them.
      - name: Crawler typecheck
        working-directory: apps/crawlee
        run: npm run build

      - name: Crawler tests
        working-directory: apps/crawlee
        run: npm test

  # Which backend jobs this PR needs: the images only when what they are built from changed,
  # the tests only when the code, the tests or the schema they run against changed. A PR that
  # touches neither skips both, so a backend failure never turns a frontend-only PR red.
  backend-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'infra/docker/docker-compose.yaml'
              - '.github/workflows/pr-checks.yml'
              - '.github/workflows/illinois-chat-dev.yml'
              - '.github/workflows/release-images.yml'
            tests:
              - 'apps/backend/**'
              - 'infra/db/init-schema.sql'
              - 'infra/scripts/add_external_project_script/**'
              - '.github/workflows/pr-checks.yml'

  # The backend pytest suite, in its own job so lint and frontend failures do not hide it
  # and it does not hide them.
  backend-tests:
    needs: backend-changes
    if: needs.backend-changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # tests/test_pgvector_store.py round-trips through a real pgvector database and skips
    # itself without TEST_POSTGRES_URI. Same image as the compose stack. The database lives
    # for one job on the runner, so it takes connections without a password.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URI: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      # Same uv release as the two Dockerfiles (ghcr.io/astral-sh/uv:<version>).
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.8"
          cache-dependency-glob: apps/backend/uv.lock

      - name: Create the database schema
        run: psql "$TEST_POSTGRES_URI" -v ON_ERROR_STOP=1 -q -f infra/db/init-schema.sql

      # --locked fails the job if pyproject.toml changed without re-locking (--frozen
      # would install the stale lock). --all-extras: the suite covers both the API and
      # the worker. The Python version comes from apps/backend/.python-version.
      - name: Install backend dependencies
        working-directory: apps/backend
        run: uv sync --locked --all-extras

      # -rs lists every skipped test with its reason, so a skip is visible in the log.
      - name: Backend tests
        working-directory: apps/backend
        run: uv run --locked pytest -rs

      # unittest cases for the external-connections CLI; they stub python-dotenv and
      # need nothing installed.
      - name: External connections CLI tests
        working-directory: infra/scripts/add_external_project_script
        run: uv run --no-project python -m unittest -v test_external_connections_cli

  # Build (no push) both backend images and run tests/image_smoke.py inside each, so a
  # broken Dockerfile, a stale uv.lock (the Dockerfiles sync with --locked) or a package
  # missing from an image's extra fails the PR instead of the push-to-main deploy.
  # Same build contexts as illinois-chat-dev.yml.
  #
  # Its own job, so a lint or frontend failure never hides a broken image. The layer cache
  # is scoped to the PR's ref (this job does not run on main), so it only saves time on
  # later pushes to the same PR.
  backend-images:
    needs: backend-changes
    if: needs.backend-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Self-Hosted-Dockerfile
            process: api
          - name: worker
            dockerfile: ai_ta_backend/rabbitmq/Dockerfile
            process: worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ic-${{ matrix.name }}:pr
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # The image holds only its own extra (api or worker), which the development
      # environment and its --all-extras install never do. No network: nothing the
      # process needs at runtime may be fetched on first use. tests/ is not in the
      # image, so the script goes in on stdin.
      - name: Smoke-test ${{ matrix.name }} image
        run: >
          docker run --rm -i --network none ic-${{ matrix.name }}:pr
          python - ${{ matrix.process }} < apps/backend/tests/image_smoke.py
