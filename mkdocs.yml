site_name: Illinois Chat
site_description: >-
  Illinois Chat is a self-hostable AI chat platform for building course,
  research, and organization-specific assistants over curated documents and
  web content.
site_url: https://docs.chat.illinois.edu/
repo_url: https://github.com/Center-for-AI-Innovation/Illinois-Chat
repo_name: Center-for-AI-Innovation/Illinois-Chat

theme:
  name: material
  custom_dir: overrides
  font: false
  logo: assets/logo_illinois.png
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

validation:
  anchors: warn

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/brand.js

plugins:
  - search
  - blog:
      blog_dir: blog
      blog_toc: true
      post_url_format: "{slug}"
      draft_if_future_date: true
      categories_allowed:
        - Releases
        - Announcements

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Center-for-AI-Innovation/Illinois-Chat
    - icon: material/web
      link: https://chat.illinois.edu
    - icon: material/email
      link: mailto:genaisupport@mx.uillinois.edu

